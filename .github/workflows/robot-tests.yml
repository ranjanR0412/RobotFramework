name: Robot Framework Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r LiveProject/requirements.txt
      
      - name: Check application accessibility
        run: |
          curl -I -L --connect-timeout 15 --max-time 30 https://ultimaworks.ltm.com/home
      
      - name: Run Robot Framework tests
        run: |
          mkdir -p results
          robot --outputdir results LiveProject/TestCases/
        continue-on-error: true
      
      - name: Upload Robot Framework reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-results
          path: results/
